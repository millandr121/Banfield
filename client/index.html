<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>Banfield, The Game</title>
    <style>
      :root {
        font-family: system-ui, sans-serif;
        color: #eaf2f8;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: #0b1d2a;
        overflow: hidden;
      }
      #game { display: block; width: 100vw; height: 100vh; }

      #creator {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 50% 30%, #15384f, #07131c);
      }
      .card {
        width: min(420px, 92vw);
        background: #0f2738;
        border: 1px solid #1d4a66;
        border-radius: 14px;
        padding: 22px 24px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
      }
      .card h1.title { margin: 0 0 4px; font-size: 30px; letter-spacing: 0.5px; }
      .card p.sub { margin: 0 0 18px; color: #8fb4c9; font-size: 13px; }
      /* The name gag: the "m" in Bamfield struck out, a fresh "n" stickered over it. */
      .swap { position: relative; display: inline-block; }
      .swap .m { color: #5f7d8c; }
      .swap .m::after {
        content: "";
        position: absolute;
        left: -1px;
        right: -1px;
        top: 52%;
        height: 3px;
        background: #e53935;
        border-radius: 2px;
        transform: rotate(-7deg);
      }
      .swap .n {
        position: absolute;
        left: 50%;
        top: -0.2em;
        transform: translateX(-50%) rotate(-6deg);
        background: #fff7e6;
        color: #15384f;
        padding: 0 0.14em;
        border-radius: 3px;
        border: 1px solid #cdbd97;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.45);
        font-weight: 800;
      }
      .title .rest { font-weight: 600; color: #cfe3ef; font-size: 0.62em; }
      label { display: block; font-size: 13px; margin: 12px 0 4px; color: #b8d4e3; }
      input[type="text"] {
        width: 100%;
        padding: 10px;
        border-radius: 8px;
        border: 1px solid #2a5a78;
        background: #0a1c29;
        color: #eaf2f8;
        font-size: 15px;
      }
      .swatches { display: flex; gap: 8px; flex-wrap: wrap; }
      .swatches input[type="color"] {
        width: 44px; height: 36px; border: none; background: none; cursor: pointer;
      }
      .row { display: flex; gap: 16px; }
      .row > div { flex: 1; }
      #preview { display: block; margin: 14px auto 4px; background: #0a1c29; border-radius: 8px; }
      button {
        width: 100%;
        margin-top: 16px;
        padding: 12px;
        border: none;
        border-radius: 8px;
        background: #1e88e5;
        color: white;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover { background: #1976d2; }

      .tabs { display: flex; gap: 8px; margin: 4px 0 6px; }
      .tab {
        flex: 1; margin: 0; padding: 9px; font-size: 14px; font-weight: 600;
        background: #0a1c29; color: #8fb4c9; border: 1px solid #2a5a78; border-radius: 8px;
        cursor: pointer; width: auto;
      }
      .tab.active { background: #1e88e5; color: #fff; border-color: #1e88e5; }
      .tab:hover { background: #123247; }
      .tab.active:hover { background: #1976d2; }
      .status { font-size: 12px; font-weight: 600; }
      .status.free { color: #57c46a; }
      .status.taken { color: #ff7676; }
      .status.checking { color: #8fb4c9; }
      .hint { color: #6f93a8; font-size: 11px; font-weight: 400; }
      .error {
        margin-top: 12px; padding: 9px 12px; border-radius: 8px;
        background: rgba(229,57,53,0.16); border: 1px solid #e53935;
        color: #ffb3b1; font-size: 13px;
      }

      #hud {
        position: fixed;
        left: 12px;
        top: 12px;
        font-size: 13px;
        text-shadow: 0 1px 2px #000;
        pointer-events: none;
      }
      #log {
        position: fixed;
        left: 12px;
        bottom: 12px;
        max-width: 360px;
        font-size: 12px;
        color: #cfe3ef;
        text-shadow: 0 1px 2px #000;
        pointer-events: none;
      }
      .hidden { display: none !important; }

      #chat-input {
        position: fixed;
        left: 12px;
        bottom: 48px;
        width: min(380px, 80vw);
        padding: 8px 12px;
        border-radius: 8px;
        border: 1px solid #1e88e5;
        background: rgba(7,19,28,0.92);
        color: #eaf2f8;
        font-size: 14px;
        outline: none;
        z-index: 10;
      }
      #chat-input::placeholder { color: #5a7f96; }

      /* ── OSRS-style right panel ── */
      #side-panel {
        position: fixed;
        right: 0; top: 0; bottom: 0;
        width: 200px;
        background: #09202e;
        border-left: 2px solid #1d4a66;
        display: flex;
        flex-direction: column;
        z-index: 6;
        font-size: 12px;
        color: #cfe3ef;
        user-select: none;
      }
      #mode-bar {
        display: flex;
        border-bottom: 2px solid #1d4a66;
        flex-shrink: 0;
      }
      .mbtn {
        flex: 1; margin: 0; padding: 8px 1px;
        font-size: 11px; font-weight: 700;
        background: #061018; color: #6a9ab5;
        border: none; border-right: 1px solid #1d4a66;
        cursor: pointer; width: auto; border-radius: 0;
      }
      .mbtn:last-child { border-right: none; }
      .mbtn:hover { background: #0e2535; color: #cfe3ef; }
      .mbtn.active { background: #15384f; color: #ffe7a8; box-shadow: inset 0 -3px 0 #ffb300; }
      #panel-tabs {
        display: flex;
        border-bottom: 2px solid #1d4a66;
        flex-shrink: 0;
      }
      .ptab {
        flex: 1; margin: 0; padding: 7px 2px;
        font-size: 11px; font-weight: 700;
        background: #07131c; color: #6a9ab5;
        border: none; border-right: 1px solid #1d4a66;
        cursor: pointer; width: auto; border-radius: 0;
      }
      .ptab:last-child { border-right: none; }
      .ptab:hover { background: #0e2535; color: #cfe3ef; }
      .ptab.active { background: #0f2f42; color: #eaf2f8; border-bottom: 2px solid #1e88e5; }
      #panel-content {
        flex: 1;
        overflow-y: auto;
        overflow-x: hidden;
        padding: 6px;
        min-height: 0;
      }
      #panel-content::-webkit-scrollbar { width: 4px; }
      #panel-content::-webkit-scrollbar-thumb { background: #1d4a66; border-radius: 2px; }
      #minimap-canvas { display: block; margin: 4px auto; }
      #panel-stats {
        border-top: 2px solid #1d4a66;
        padding: 8px 8px 6px;
        flex-shrink: 0;
        background: #07131c;
      }
      .stat-row {
        display: flex; align-items: center;
        gap: 4px; margin-bottom: 4px;
      }
      .stat-label { width: 32px; font-size: 10px; color: #8fb4c9; flex-shrink: 0; }
      .stat-bar {
        flex: 1; height: 8px; background: #0a1c29;
        border-radius: 4px; overflow: hidden; border: 1px solid #1d4a66;
      }
      .stat-fill { height: 100%; border-radius: 4px; transition: width 0.3s; }
      .hp-fill   { background: #e53935; }
      .stam-fill { background: #f9a825; }
      .hun-fill  { background: #43a047; }
      .stat-val  { width: 26px; font-size: 10px; text-align: right; flex-shrink: 0; }
      .panel-info { font-size: 11px; color: #8fb4c9; margin-top: 3px; }
      /* Inventory grid */
      .inv-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 3px;
        padding: 2px 0;
      }
      .inv-cell {
        background: #0a1c29;
        border: 1px solid #1d4a66;
        border-radius: 4px;
        padding: 3px;
        text-align: center;
        cursor: default;
      }
      .inv-swatch {
        width: 100%; height: 22px;
        border-radius: 3px;
        margin-bottom: 2px;
      }
      .inv-qty { font-size: 10px; font-weight: 700; color: #eaf2f8; }
      .inv-name { font-size: 9px; color: #7faacc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      /* Skills */
      .stats-header { padding: 4px 2px 8px; border-bottom: 1px solid #1d4a66; margin-bottom: 6px; }
      .skill-list { padding: 2px 0; }
      .skill-row { margin-bottom: 5px; }
      .skill-name { display: inline-block; width: 80px; font-size: 11px; color: #9fc2d6; text-transform: capitalize; }
      .skill-lv { display: inline-block; width: 30px; font-size: 11px; font-weight: 700; color: #ffd54f; text-align: right; }
      .skill-bar { height: 5px; background: #0a1c29; border-radius: 3px; overflow: hidden; margin-top: 2px; border: 1px solid #1d4a66; }
      .skill-fill { height: 100%; background: #1e88e5; border-radius: 3px; }
      /* Logbook */
      .log-header { font-weight: 700; color: #7fd0c2; margin-bottom: 6px; font-size: 11px; }
      .log-group { font-weight: 700; color: #7fd0c2; margin: 6px 0 2px; font-size: 11px; border-top: 1px solid #1d4a66; padding-top: 4px; }
      .log-entry { font-size: 10px; padding: 1px 0 1px 6px; }
      /* Controls help */
      .controls-section { font-size: 10px; color: #6a9ab5; line-height: 1.5; padding: 2px 0; }
      .controls-section b { color: #9fc2d6; }
      .panel-empty { color: #5a7f96; font-size: 12px; text-align: center; padding: 20px 4px; }

      /* Body-customisation chip selectors */
      .chip-group { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
      .chip {
        padding: 4px 10px; border-radius: 12px; font-size: 12px;
        background: #0a1c29; color: #8fb4c9; border: 1px solid #2a5a78;
        cursor: pointer; user-select: none; transition: background 0.12s;
      }
      .chip.selected { background: #1e88e5; color: #fff; border-color: #1e88e5; }
      .chip:hover:not(.selected) { background: #123247; }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>

    <div id="hud" class="hidden"></div>
    <div id="log" class="hidden"></div>
    <input id="chat-input" class="hidden" type="text" maxlength="160" placeholder="Chat — / global, // team, ///Name private, /team Name — Enter to send" autocomplete="off" />

    <!-- OSRS-style right panel (shown once player is in-game) -->
    <div id="side-panel" class="hidden">
      <div id="mode-bar">
        <button class="mbtn active" id="mode-combat" title="Tab to cycle">⚔ Combat</button>
        <button class="mbtn" id="mode-research" title="Tab to cycle">🔬 Research</button>
        <button class="mbtn" id="mode-profession" title="Tab to cycle">🛠 Pro</button>
      </div>
      <div id="panel-tabs">
        <button class="ptab active" id="ptab-inv">Inv</button>
        <button class="ptab" id="ptab-equip">Equip</button>
        <button class="ptab" id="ptab-skills">Skills</button>
        <button class="ptab" id="ptab-log">Log</button>
        <button class="ptab" id="ptab-map">Map</button>
        <button class="ptab" id="ptab-help">?</button>
      </div>
      <div id="panel-content"></div>
      <canvas id="minimap-canvas" class="hidden" width="184" height="150"></canvas>
      <div id="panel-stats"></div>
    </div>

    <div id="creator">
      <div class="card">
        <h1 class="title">Ba<span class="swap"><span class="m">m</span><span class="n">n</span></span>field<span class="rest">,&nbsp;The Game</span></h1>
        <p class="sub">Survive low tide and high tide on the coast of Barkley Sound.</p>

        <div class="tabs">
          <button type="button" id="tab-new" class="tab active">New here</button>
          <button type="button" id="tab-return" class="tab">Returning</button>
        </div>

        <label for="name">Name <span id="name-status" class="status"></span></label>
        <input id="name" type="text" maxlength="16" placeholder="Pick a unique name" autocomplete="off" />

        <label for="pass">Password <span class="hint">— remembers your character on any device</span></label>
        <input id="pass" type="password" maxlength="64" placeholder="Something you'll remember" autocomplete="off" />

        <div id="email-row">
          <label for="email">Email <span class="hint">— optional, for account recovery</span></label>
          <input id="email" type="email" maxlength="120" placeholder="you@example.com (optional)" autocomplete="off" />
        </div>

        <div id="design">
          <div style="display:flex;gap:12px;align-items:flex-start;">
            <canvas id="preview" width="80" height="160" style="border-radius:8px;background:#0a1c29;flex-shrink:0;"></canvas>
            <div style="flex:1;min-width:0;">
              <div class="row">
                <div>
                  <label>Skin</label>
                  <div class="swatches"><input id="skin" type="color" value="#e0ac69" /></div>
                </div>
                <div>
                  <label>Hair</label>
                  <div class="swatches"><input id="hair" type="color" value="#3b2a1a" /></div>
                </div>
                <div>
                  <label>Shirt</label>
                  <div class="swatches"><input id="shirt" type="color" value="#2e7d32" /></div>
                </div>
              </div>

              <label>Hair length</label>
              <div class="chip-group" id="chips-hairStyle">
                <span class="chip selected" data-val="short">Buzz</span>
                <span class="chip" data-val="medium">Medium</span>
                <span class="chip" data-val="long">Long</span>
              </div>

              <label>Build</label>
              <div class="chip-group" id="chips-bodyBuild">
                <span class="chip selected" data-val="slight">Wiry</span>
                <span class="chip" data-val="medium">Solid</span>
                <span class="chip" data-val="sturdy">Stout</span>
              </div>

              <label>Chest</label>
              <div class="chip-group" id="chips-breastSize">
                <span class="chip selected" data-val="non">Flat</span>
                <span class="chip" data-val="modest">Modest</span>
                <span class="chip" data-val="expressive">Expressive</span>
              </div>

              <label>Hips</label>
              <div class="chip-group" id="chips-hipSize">
                <span class="chip selected" data-val="narrow">Narrow</span>
                <span class="chip" data-val="medium">Average</span>
                <span class="chip" data-val="wide">Wide</span>
              </div>
            </div>
          </div>
        </div>

        <div id="auth-error" class="error hidden"></div>
        <button id="play">Wash ashore</button>
      </div>
    </div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
